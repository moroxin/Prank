<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VSBM</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    button {
      margin: 30px;
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
    }

    #site {
      width: 100%;
      height: 80vh;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <button onclick="startTest()">START</button>

  <div id="site"></div>

  <script>
    function startTest() {
      document.getElementById("site").innerHTML = `
        <iframe src="https://cznull.github.io/vsbm"></iframe>
      `;
    }
  </script>

</body>
</html>
